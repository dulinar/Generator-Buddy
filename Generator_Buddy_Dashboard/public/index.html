<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Generator Buddy - Smart generator monitoring, maintenance, and administration."
    />
    <title>Generator Buddy</title>
    <link
      rel="icon"
      href="/assets/logo.svg"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/polish.css" />
    <link rel="stylesheet" href="/brand.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <dialog id="modal">
      <form id="modal-form">
        <div class="dialog-header">
          <h2 id="modal-title"></h2>
          <button
            type="button"
            class="icon-button"
            id="close-modal"
            aria-label="Close dialog"
          >
            ×
          </button>
        </div>
        <div id="modal-fields"></div>
        <p id="modal-error" class="error" role="alert"></p>
        <div class="dialog-footer">
          <button type="button" class="button secondary" id="cancel-modal">
            Cancel</button
          ><button type="submit" class="button">Add</button>
        </div>
      </form>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
