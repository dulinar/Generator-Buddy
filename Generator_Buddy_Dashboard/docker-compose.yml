services:
  generator-buddy:
    build:
      context: .
      dockerfile: Dockerfile
    image: generator-buddy:latest
    container_name: generator-buddy-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MYSQL_HOST=${MYSQL_HOST:-141.148.197.200}
      - MYSQL_PORT=${MYSQL_PORT:-3307}
      - MYSQL_USER=${MYSQL_USER:-project}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-generator_monitoring}
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET}
      - TELEMETRY_API_KEY=${TELEMETRY_API_KEY:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/session"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
