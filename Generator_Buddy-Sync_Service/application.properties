# ===================================================================
# Generator Monitoring Sync Service - Application Properties
# ===================================================================

# -------------------------------------------------------------------
# Service & Logging Configuration
# -------------------------------------------------------------------
app.name=generator-sync-service
app.env=production
app.log.level=INFO

# -------------------------------------------------------------------
# Mosquitto MQTT Broker Configuration
# -------------------------------------------------------------------
# Broker URL or host/port combination
mqtt.broker.url=mqtt://127.0.0.1:1883
mqtt.host=127.0.0.1
mqtt.port=1883
mqtt.client.id=generator_mysql_sync_service
mqtt.username=esp32
mqtt.password=Dulina123

# Topic pattern with wildcard '+' to ingest readings from all generators
mqtt.topic=generator/+/readings
mqtt.qos=1
mqtt.reconnect.period.ms=5000
mqtt.connect.timeout.ms=30000

# -------------------------------------------------------------------
# MySQL Database Configuration (generator_monitoring database)
# -------------------------------------------------------------------
db.host=127.0.0.1
db.port=3306
db.user=admin
db.password=Dulina123
db.name=generator_monitoring

# Connection Pool Settings
db.pool.connection.limit=10
db.pool.queue.limit=0
db.pool.wait.for.connections=true
db.pool.enable.keep.alive=true
db.pool.keep.alive.initial.delay=10000

# -------------------------------------------------------------------
# Generator Offline Inactivity Settings
# -------------------------------------------------------------------
# If no data is received within this time (in seconds), status becomes 'offline' (60s = 1 minute)
generator.offline.timeout.seconds=60
# How often (in seconds) the background monitor checks for inactive generators
generator.offline.check.interval.seconds=15
