# HTTP: redirect everything to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name generatorbuddy.duckdns.org;

    return 301 https://$host$request_uri;
}

# HTTPS: Generator Buddy reverse proxy
server {
    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot

    server_name generatorbuddy.duckdns.org;

    # SSL certificate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/generatorbuddy.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/generatorbuddy.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Reverse proxy to Generator Buddy Node.js / Docker container
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket and connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard client identity & forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable proxy buffering for real-time live telemetry polling
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}
